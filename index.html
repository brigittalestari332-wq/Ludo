<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ludo Sederhana</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        /* Pengatur 5 Logo Berjejer Kecil */
        .logo-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .logo-group img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        h1 { 
            margin: 0 0 15px 0; 
            font-size: 20px; 
            color: #fbbf24; 
        }

        /* Status & Informasi Giliran */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Area Game Canvas Ludo */
        #gameCanvas {
            background-color: #0f172a;
            border: 3px solid #fbbf24;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
            max-width: 90vw;
            height: auto;
        }

        /* Tombol Kontrol Lempar Dadu */
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .ctrl-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background: #37474f;
            color: #fff;
            border: 2px solid #fbbf24;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s;
        }

        .ctrl-btn:active {
            background: #fbbf24;
            color: #000;
        }

        .ctrl-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #64748b;
        }

        #message {
            font-size: 15px;
            font-weight: bold;
            color: #4ade80;
            min-height: 24px;
            margin-top: 15px;
        }

        .instructions {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Wadah 5 Logo -->
    <div class="logo-group">
        <img src="IMG-20260728-WA0064.jpg"alt="Logo 1">
        <img src="File1.jpg" alt="Logo 2">
        <img src="File2.jpg" alt="Logo 3">
        <img src="File3.jpg" alt="Logo 4">
        <img src="file4.jpg" alt="Logo 5">
    </div>

    <!-- Judul Game -->
    <h1>Game Ludo Mini (1 vs 1)</h1>

    <!-- Papan Status & Giliran -->
    <div class="stats-container">
        <div class="stat-card">Giliran: <span id="turn-txt" style="color:#38bdf8">Biru</span></div>
        <div class="stat-card">Dadu: <span id="dice-txt" style="color:#fbbf24">-</span></div>
        <div class="stat-card">Biru: <span id="blue-score-txt" style="color:#38bdf8">0/2</span></div>
        <div class="stat-card">Merah: <span id="red-score-txt" style="color:#f87171">0/2</span></div>
    </div>

    <!-- Canvas Game -->
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <!-- Tombol Lempar Dadu -->
    <div class="controls-container">
        <button id="roll-btn" class="ctrl-btn" onclick="rollDice()">🎲 Kocok Dadu</button>
    </div>

    <div id="message">Klik "Kocok Dadu" untuk memulai permainan!</div>

    <p class="instructions">
        <strong>Cara Bermain:</strong> Dapatkan angka <strong>6</strong> untuk mengeluarkan bidak dari markas. Pindahkan semua bidak ke petak FINISH untuk menang!
    </p>

    <script>
        // Efek Suara dengan Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Jalur lintasan permainan (16 langkah standar mini)
        const path = [
            {x: 20, y: 120}, {x: 60, y: 120}, {x: 100, y: 120}, {x: 120, y: 100},
            {x: 120, y: 60}, {x: 120, y: 20}, {x: 160, y: 20}, {x: 160, y: 60},
            {x: 160, y: 100}, {x: 180, y: 120}, {x: 220, y: 120}, {x: 260, y: 120},
            {x: 260, y: 160}, {x: 220, y: 160}, {x: 180, y: 160}, {x: 160, y: 180},
            {x: 160, y: 220}, {x: 160, y: 260}, {x: 120, y: 260}, {x: 120, y: 220},
            {x: 120, y: 180}, {x: 100, y: 160}, {x: 60, y: 160}, {x: 20, y: 160}
        ];

        // Data Pemain
        const players = {
            blue: {
                color: '#38bdf8',
                homePos: [{x: 40, y: 40}, {x: 70, y: 40}],
                startIdx: 0,
                homeIdx: 23,
                tokens: [-1, -1], // -1 artinya masih di markas
                finished: 0
            },
            red: {
                color: '#f87171',
                homePos: [{x: 210, y: 210}, {x: 240, y: 210}],
                startIdx: 12,
                homeIdx: 11,
                tokens: [-1, -1],
                finished: 0
            }
        };

        let currentTurn = 'blue';
        let diceValue = 0;
        let waitingForMove = false;
        let gameActive = true;

        // Gambar Papan Ludo
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Markas Biru
            ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
            ctx.fillRect(10, 10, 100, 100);
            ctx.strokeStyle = '#38bdf8';
            ctx.strokeRect(10, 10, 100, 100);

            // Markas Merah
            ctx.fillStyle = 'rgba(248, 113, 113, 0.2)';
            ctx.fillRect(190, 190, 100, 100);
            ctx.strokeStyle = '#f87171';
            ctx.strokeRect(190, 190, 100, 100);

            // Area Finish / Tengah
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(120, 120, 60, 60);
            ctx.fillStyle = '#0f172a';
            ctx.font = '10px sans-serif';
            ctx.fillText('FINISH', 132, 153);

            // Gambar Jalur Lintasan
            path.forEach((pt, idx) => {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.strokeRect(pt.x, pt.y, 20, 20);
            });

            // Gambar Bidak Pemain
            drawTokens();
        }

        function drawTokens() {
            // Bidak Biru
            players.blue.tokens.forEach((pos, idx) => {
                ctx.fillStyle = players.blue.color;
                ctx.beginPath();
                if (pos === -1) {
                    ctx.arc(players.blue.homePos[idx].x, players.blue.homePos[idx].y, 10, 0, Math.PI * 2);
                } else if (pos === 99) {
                    ctx.arc(135 + (idx * 12), 135, 8, 0, Math.PI * 2);
                } else {
                    const p = path[pos];
                    ctx.arc(p.x + 10, p.y + 10, 8, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            });

            // Bidak Merah
            players.red.tokens.forEach((pos, idx) => {
                ctx.fillStyle = players.red.color;
                ctx.beginPath();
                if (pos === -1) {
                    ctx.arc(players.red.homePos[idx].x, players.red.homePos[idx].y, 10, 0, Math.PI * 2);
                } else if (pos === 99) {
                    ctx.arc(135 + (idx * 12), 155, 8, 0, Math.PI * 2);
                } else {
                    const p = path[pos];
                    ctx.arc(p.x + 10, p.y + 10, 8, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            });
        }

        function rollDice() {
            if (!gameActive || waitingForMove) return;

            playSound(400, 0.1);
            diceValue = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-txt').innerText = diceValue;

            const player = players[currentTurn];
            const canMoveAny = player.tokens.some(t => t !== 99 && (t !== -1 || diceValue === 6));

            if (!canMoveAny) {
                document.getElementById('message').innerText = `Dadu ${diceValue}! Tidak ada bidak yang bisa jalan.`;
                setTimeout(switchTurn, 1200);
            } else {
                waitingForMove = true;
                document.getElementById('message').innerText = `Dadu ${diceValue}! Klik bidak ${currentTurn.toUpperCase()} untuk melangkah.`;
                
                // Otomatis jalankan bidak jika hanya ada 1 pilihan valid
                const movableIndices = [];
                player.tokens.forEach((t, i) => {
                    if (t !== 99 && (t !== -1 || diceValue === 6)) movableIndices.push(i);
                });

                if (movableIndices.length === 1) {
                    setTimeout(() => moveToken(movableIndices[0]), 500);
                }
            }
        }

        function moveToken(tokenIndex) {
            if (!waitingForMove) return;

            const player = players[currentTurn];
            let pos = player.tokens[tokenIndex];

            if (pos === 99) return; // Sudah finish

            if (pos === -1) {
                if (diceValue === 6) {
                    player.tokens[tokenIndex] = player.startIdx;
                    playSound(600, 0.15);
                    finishMove();
                }
            } else {
                let nextPos = (pos + diceValue) % path.length;
                player.tokens[tokenIndex] = nextPos;
                playSound(500, 0.1);

                // Cek Masuk Finish
                if (pos <= player.homeIdx && nextPos > player.homeIdx) {
                    player.tokens[tokenIndex] = 99;
                    player.finished++;
                    playSound(800, 0.3);
                    
                    if (currentTurn === 'blue') {
                        document.getElementById('blue-score-txt').innerText = `${player.finished}/2`;
                    } else {
                        document.getElementById('red-score-txt').innerText = `${player.finished}/2`;
                    }
                }

                finishMove();
            }
        }

        function finishMove() {
            drawBoard();
            waitingForMove = false;

            // Cek Kemenangan
            if (players[currentTurn].finished >= 2) {
                gameActive = false;
                playSound(900, 0.5);
                document.getElementById('message').innerText = `🏆 SELAMAT! Pemain ${currentTurn.toUpperCase()} Menang!`;
                document.getElementById('roll-btn').disabled = true;
                return;
            }

            // Giliran tambahan jika dapat angka 6
            if (diceValue === 6) {
                document.getElementById('message').innerText = `Dapat 6! Pemain ${currentTurn.toUpperCase()} kocok dadu lagi.`;
            } else {
                switchTurn();
            }
        }

        function switchTurn() {
            currentTurn = currentTurn === 'blue' ? 'red' : 'blue';
            const turnTxt = document.getElementById('turn-txt');
            turnTxt.innerText = currentTurn === 'blue' ? 'Biru' : 'Merah';
            turnTxt.style.color = currentTurn === 'blue' ? '#38bdf8' : '#f87171';
            document.getElementById('message').innerText = `Giliran Pemain ${currentTurn.toUpperCase()}. Kocok dadu!`;
        }

        // Event listener saat mengeklik canvas untuk memilih bidak
        canvas.addEventListener('click', (e) => {
            if (!waitingForMove) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const player = players[currentTurn];

            player.tokens.forEach((pos, idx) => {
                let targetX, targetY;
                if (pos === -1) {
                    targetX = player.homePos[idx].x;
                    targetY = player.homePos[idx].y;
                } else if (pos !== 99) {
                    targetX = path[pos].x + 10;
                    targetY = path[pos].y + 10;
                }

                if (targetX && Math.hypot(clickX - targetX, clickY - targetY) < 20) {
                    if (pos === -1 && diceValue === 6) {
                        moveToken(idx);
                    } else if (pos !== -1 && pos !== 99) {
                        moveToken(idx);
                    }
                }
            });
        });

        // Inisialisasi awal papan game
        drawBoard();
    </script>
</body>
</html>
